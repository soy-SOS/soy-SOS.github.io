# Define type Entry
#
# Entry:
#   &refalias
#   name            string
#   number          number
#   subtype         string
#   forms           map{field: string}
#
# ---------------------------------------
# declinations:
#   all_types       Entry[]
#   a               *Entry
#   o               *Entry
#   consonant       *Entry
#   mixed           *Entry
#   i               *Entry
#   u               *Entry
#   e               *Entry

