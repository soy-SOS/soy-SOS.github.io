tempori:
  - name: present
    display: Präsens
    stem: present
    base_endings: &present_end [ō, s, t, mus, tis, nt]
  - name: imperfect
    display: Imperfekt
    stem: present
    base_endings: &imperfect_end [m, s, t, mus, tis, nt]
  - name: perfect
    display: Perfekt
    stem: perfect
    base_endings: &perfect_end [ī, istī, it, imus, istis, ērunt]
  - name: plusquamperfect
    display: Plusquamperfekt
    stem: perfect
    base_endings: &plusquamperfect_end [eram, erās, erat, erāmus, erātis, erant]

persons:
  - "1. Sg"
  - "2. Sg"
  - "3. Sg"
  - "1. Pl"
  - "2. Pl"
  - "3. Pl"

classes:
  - class: 1
    name: ā
    subtype: ā
    tempus_sign: ba
    present: *present_end
    imperfect: *imperfect_end
    perfect: *perfect_end
    plusquamperfect: *plusquamperfect_end
    stem: { present: "[root]-ā", perfect: "[root]" }
    formation:
      present:
        [
          "[root]-[end]",
          "[stem]-[end]",
          "[root]-a-[end]",
          "[stem]-[end]",
          "[stem]-[end]",
          "[root]-a-[end]",
        ]
      imperfect: &imperfect_formations
        - "[stem]-[temp]-[end]"
        - "[stem]-[temp]-[end]"
        - "[stem]-[temp]-[end]"
        - "[stem]-[temp]-[end]"
        - "[stem]-[temp]-[end]"
        - "[stem]-[temp]-[end]"
      perfect: &perfect_formations
        - "[root]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
      plusquamperfect: &pqp_formations
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
        - "[stem]-[end]"
  - class: 2
    name: ē
    subtype: ē
    tempus_sign: ba
    present: *present_end
    imperfect: *imperfect_end
    perfect: *perfect_end
    plusquamperfect: *plusquamperfect_end
    stem: { present: "[root]-ē", perfect: "[root]" }
    formation:
      present:
        [
          "[root]-e-[end]",
          "[stem]-[end]",
          "[root]-e-[end]",
          "[stem]-[end]",
          "[stem]-[end]",
          "[root]-e-[end]",
        ]
      imperfect: *imperfect_formations
      perfect: *perfect_formations
      plusquamperfect: *pqp_formations
  - class: 3
    name: konsonant
    subtype: konsonant
    tempus_sign: ēba
    present: *present_end
    imperfect: *imperfect_end
    perfect: *perfect_end
    plusquamperfect: *plusquamperfect_end
    stem: { present: "[root]", perfect: "[root]" }
    formation:
      present:
        [
          "[root]-[end]",
          "[root]-i-[end]",
          "[root]-i-[end]",
          "[root]-i-[end]",
          "[root]-i-[end]",
          "[root]-u-[end]",
        ]
      imperfect: *imperfect_formations
      perfect: *perfect_formations
      plusquamperfect: *pqp_formations
  - class: 3
    name: suppletive
    subtype: suppletive
    tempus_sign: ēba
