# TODO: Change to tempora
tempori:
  - name: present
    display: Präsens
    stem: present
    endings: &present_end [ō, s, t, mus, tis, nt]
  - name: imperfect
    display: Imperfekt
    stem: present
    endings: &imperfect_end [m, s, t, mus, tis, nt]
  - name: perfect
    display: Perfekt
    stem: perfect
    endings: &perfect_end [ī, istī, it, imus, istis, ērunt]
  - name: plusquamperfect
    display: Plusquamperfekt
    stem: perfect
    endings: &plusquamperfect_end [eram, erās, erat, erāmus, erātis, erant]

