    - id: verb.irregular.subjunctive.active.plusquamperfect
      forms: [āfuissem, āfuissēs, āfuisset, āfuissēmus, āfuissētis, āfuissent]

    - id: verb.irregular.infinitive.active.present
      forms: [abesse]
