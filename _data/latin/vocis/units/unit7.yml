    - id: verb.irregular.subjunctive.active.present
      forms: [absim / abfuam, absīs, absit, absīmus, absītis, absint]
    - id: verb.irregular.subjunctive.active.imperfect
      forms: [abessem, abessēs, abesset, abessēmus, abessētis, abessent]
