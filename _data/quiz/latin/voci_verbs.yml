classes:
  - class: 1
    name: ā
    present: [ō, ās, at, āmus, ātis, ant]
    imperfect: [ābam, ābas, ābat, ābamus, ābatis, ābant]
    perfect: &a_perfect_endings [ī, istī, it, imus, istis, ērunt]
  - class: 2
    name: ē
    present: [eō, ēs, et, ēmus, ētis, ent]
    imperfect: &e_imperfect_endings [ēbam, ēbās, ēbat, ēbāmus, ēbātis, ēbant]
    perfect: *a_perfect_endings
  - class: 3
    name: konsonant
    present: &konsonant_imperfect_endings [ō, is, it, imus, itis, unt]
    imperfect: *e_imperfect_endings
    perfect: *a_perfect_endings
  - class: 3
    name: iō
    present: [iō, is, it, imus, itis, unt]
    imperfect: *e_imperfect_endings
    perfect: *a_perfect_endings
  - class: irregular
    name: irregular
    present: *konsonant_imperfect_endings
    imperfect: *e_imperfect_endings
    perfect: *a_perfect_endings
  - class: 3
    name: suppletive
    present: [ō, s, t, imus, tis, unt]
    imperfect: *e_imperfect_endings
    perfect: *a_perfect_endings
  - class: 4
    name: ī
    present: [iō, īs, it, īmus, ītis, iunt]
    imperfect: [iēbam, iēbās, iēbat, iēbāmus, iēbātis, iēbant]
    perfect: *a_perfect_endings

time:
  - name: present
    display: Präsens
    stem: present
  - name: imperfect
    display: Imperfekt
    stem: present
  - name: perfect
    display: Perfekt
    stem: perfect

person:
