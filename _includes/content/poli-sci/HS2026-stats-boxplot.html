<script src="https://cdn.plot.ly/plotly-4.1.1.min.js" charset="utf-8"></script>
<div class="plot" id='parent-{{include.divclass}}'></div>
<script>
  const div = document.createElement('div');
  div.className = '{{include.divclass}}';
  div.id = '{{include.divclass}}';
  document.getElementById('parent-{{ include.divclass }}').appendChild(div);
  const items = [3, 4, 2, 2, 1];
  const trace1 = {
    x: items,
    type: 'box',
    marker: {
      color: 'rgb(8,81,156)'
    },
    boxmean: 'sd',
    boxpoints: 'all'
  };
  const data = [trace1];
  const layout = {
    title: {
      text: `Boxplot für [${items}]`
    }
  };
  Plotly.newPlot(div, data, layout);
</script>
